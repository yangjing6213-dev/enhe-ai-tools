<html lang="en">

        <button class="provider-button" type="button"><svg class="provider-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.64 0 8.13c0 3.59 2.29 6.64 5.47 7.71.4.08.55-.18.55-.39 0-.19-.01-.83-.01-1.5-2.01.38-2.53-.5-2.69-.96-.09-.23-.48-.96-.82-1.15-.28-.15-.68-.53-.01-.54.63-.01 1.08.59 1.23.83.72 1.23 1.87.88 2.33.67.07-.53.28-.88.51-1.08-1.78-.21-3.64-.91-3.64-4.02 0-.89.31-1.62.82-2.19-.08-.2-.36-1.03.08-2.16 0 0 .67-.22 2.2.84A7.32 7.32 0 0 1 8 3.92c.68 0 1.36.09 2 .27 1.53-1.06 2.2-.84 2.2-.84.44 1.13.16 1.96.08 2.16.51.57.82 1.3.82 2.19 0 3.12-1.87 3.81-3.65 4.02.29.25.54.74.54 1.5 0 1.08-.01 1.95-.01 2.22 0 .22.15.47.55.39A8.14 8.14 0 0 0 16 8.13C16 3.64 12.42 0 8 0Z"/></svg><span>Continue with GitHub</span></button>
      </div>
      <div class="divider">or</div>
      <form><div class="form-field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email"></div><button class="primary-button auth-submit" type="button">Continue</button></form>
      <p class="terms">By continuing, you agree to ENHE AI’s <a href="https://www.enhe-tech.com.cn/en/legal/user-agreement">Terms of Use</a> and <a href="https://www.enhe-tech.com.cn/en/legal/privacy-policy">Privacy Policy</a>.</p>
    </section>
  </main>
  <script src="../prototype.js"></script>

</html>
