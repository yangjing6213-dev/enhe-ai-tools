name: enhe-ai-tools

services:
  db:
    image: postgres:16-alpine
    container_name: enhe-ai-tools-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - enhe-ai-tools-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - enhe-ai-tools-net

  app:
    build:
      context: ../..
      dockerfile: deploy/enhe-ai-tools/Dockerfile
      args:
        APP_URL: ${APP_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        RELEASE_REF: ${RELEASE_REF:-local}
    image: enhe-ai-tools:${APP_IMAGE_TAG:-${RELEASE_REF:-local}}
    container_name: enhe-ai-tools-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
      - ../../zpay.env
    environment:
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      RELEASE_REF: ${RELEASE_REF:?RELEASE_REF is required}
      SEO_AUDIT_WORKER_HEARTBEAT_FILE: /app/runtime/seo-audit-worker-heartbeat.json
      SEO_AUDIT_SCHEDULER_HEARTBEAT_FILE: /app/runtime/seo-audit-scheduler-heartbeat.json
      ZPAY_REFUND_CONFIRMATION_STORE: /app/runtime/zpay-refund-confirmations
      UPLOAD_DIR: /app/public/uploads
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./uploads:/app/public/uploads
      - ./secrets:/app/secrets:ro
      - ./logs:/app/logs
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health?scope=app').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - enhe-ai-tools-net

  seo-audit-worker:
    image: enhe-ai-tools:${APP_IMAGE_TAG:-${RELEASE_REF:-local}}
    container_name: enhe-ai-tools-seo-audit-worker
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    command: ["node", "deploy/enhe-ai-tools/scripts/seo-audit-worker.mjs"]
    environment:
      RELEASE_REF: ${RELEASE_REF:?RELEASE_REF is required}
      SEO_AUDIT_INTERNAL_BASE_URL: http://app:3000
      AUDIT_WORKER_TOKEN_CURRENT: ${AUDIT_WORKER_TOKEN_CURRENT}
      SEO_AUDIT_ENGINE_PATH: /app/audit-engine/site_audit.py
      SEO_AUDIT_ENGINE_SHA256: ${SEO_AUDIT_ENGINE_SHA256}
      SEO_AUDIT_ENGINE_VERSION: ${SEO_AUDIT_ENGINE_VERSION:-1.4.8}
      SEO_AUDIT_WORKER_ID: ${SEO_AUDIT_WORKER_ID:-enhe-worker-1}
      SEO_AUDIT_WORKER_HEARTBEAT_FILE: /app/runtime/seo-audit-worker-heartbeat.json
      SEO_AUDIT_WORKER_POLL_MS: ${SEO_AUDIT_WORKER_POLL_MS:-5000}
    volumes:
      - ${SEO_AUDIT_ENGINE_HOST_PATH}:/app/audit-engine/site_audit.py:ro
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const f=require('fs');const p=JSON.parse(f.readFileSync('/app/runtime/seo-audit-worker-heartbeat.json'));const releaseMatches=/^[0-9a-fA-F]{40}$/.test(p.releaseRef)&&p.releaseRef===process.env.RELEASE_REF;if(!releaseMatches||p.status!=='ok'||Date.now()-Date.parse(p.checkedAt)>120000)process.exit(1)\""]
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 20s
    networks:
      - enhe-ai-tools-net

  seo-audit-scheduler:
    image: enhe-ai-tools:${APP_IMAGE_TAG:-${RELEASE_REF:-local}}
    container_name: enhe-ai-tools-seo-audit-scheduler
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    command: ["node", "deploy/enhe-ai-tools/scripts/seo-audit-scheduler.mjs"]
    environment:
      RELEASE_REF: ${RELEASE_REF:?RELEASE_REF is required}
      SEO_AUDIT_INTERNAL_BASE_URL: http://app:3000
      AUDIT_WORKER_TOKEN_CURRENT: ${AUDIT_WORKER_TOKEN_CURRENT}
      SEO_AUDIT_SCHEDULER_HEARTBEAT_FILE: /app/runtime/seo-audit-scheduler-heartbeat.json
      SEO_AUDIT_SCHEDULER_INTERVAL_MS: ${SEO_AUDIT_SCHEDULER_INTERVAL_MS:-60000}
    volumes:
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const f=require('fs');const p=JSON.parse(f.readFileSync('/app/runtime/seo-audit-scheduler-heartbeat.json'));const releaseMatches=/^[0-9a-fA-F]{40}$/.test(p.releaseRef)&&p.releaseRef===process.env.RELEASE_REF;if(!releaseMatches||p.status!=='ok'||Date.now()-Date.parse(p.checkedAt)>180000)process.exit(1)\""]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 20s
    networks:
      - enhe-ai-tools-net

volumes:
  enhe-ai-tools-postgres-data:
    external: true
    name: enhe-ai-tools_enhe-ai-tools-postgres-data

networks:
  enhe-ai-tools-net:
    name: enhe-ai-tools-net
